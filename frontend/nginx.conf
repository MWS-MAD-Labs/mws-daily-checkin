server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # The SPA shell must always be revalidated so newly deployed routes
    # are picked up immediately on staging and production.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files /index.html =404;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend OAuth callback route (must be BEFORE /auth/ proxy)
    # This is a React SPA route, NOT a backend route
    location /auth/callback {
        try_files $uri $uri/ /index.html;
    }

    # Backward-compatible Hub SSO launch URL. Some Hub app configs append
    # /auth/sso to the app's post-login route (/select-role), but the real
    # relay endpoint lives at the backend-owned /auth/sso path.
    location = /select-role/auth/sso {
        return 307 /auth/sso$is_args$args;
    }

    # Explicit hub entry points used after login and by direct browser access.
    location = /support-hub {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files /index.html =404;
    }

    location = /student/support-hub {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files /index.html =404;
    }

    # Proxy Google OAuth and auth API routes to backend
    location /auth/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.io (WebSocket support)
    location /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MTSS fallback for unified deployments. The gateway normally owns /mtss,
    # but this keeps direct hits to the Daily FE from rendering Daily's 404.
    location /mtss/ {
        set $mtss_fe mtss-system-fe;
        proxy_pass http://$mtss_fe:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /mtss {
        return 308 /mtss/;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache service worker files - browser must always fetch latest
    location ~ ^/(sw\.js|mws-sw\.js|workbox-.*)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Asset caching
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
