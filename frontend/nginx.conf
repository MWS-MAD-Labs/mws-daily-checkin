# daily-checkin FE — served under /daily-checkin/ (path-based "one app" gateway).
# The build is COPIED into /usr/share/nginx/html/daily-checkin (see Dockerfile),
# so all /daily-checkin/* paths match naturally without alias/rewrite.
# API/auth/socket are proxied to the backend with the /daily-checkin prefix
# STRIPPED (the backend still receives /api, /auth, etc.) - mirrors MTSS's
# own frontend/nginx.conf for /mtss/.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Container-level health check (outside /daily-checkin)
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Direct hits to root → send to /daily-checkin/
    location = / {
        return 302 /daily-checkin/;
    }

    # Kill switch for browsers still running the pre-migration service
    # worker at scope '/' (see legacy-root-sw-kill.js) - never cache these,
    # or a stale copy of the kill switch itself becomes the same problem.
    location ~ ^/(sw\.js|mws-sw\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── API → backend (strip /daily-checkin) ────────────────────────────
    # /daily-checkin/api/v1/x → backend:3001/api/v1/x
    location /daily-checkin/api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The auth callback is an SPA route (MUST come before /daily-checkin/auth/)
    location = /daily-checkin/auth/callback {
        try_files /daily-checkin/index.html =404;
    }

    # ── Auth routes → backend (strip /daily-checkin) ────────────────────
    location /daily-checkin/auth/ {
        proxy_pass http://backend:3001/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Socket.io (WebSocket) → backend (strip /daily-checkin) ──────────
    location /daily-checkin/socket.io/ {
        proxy_pass http://backend:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Explicit entry points used after login and by direct browser access -
    # always revalidated so newly deployed routes are picked up immediately.
    # /daily-checkin/support-hub and /daily-checkin/student/support-hub are
    # now redirect-only routes (RouteConfig.jsx) - kept here for anyone
    # hitting them directly before that redirect can run client-side.
    location = /daily-checkin/support-hub {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files /daily-checkin/index.html =404;
    }

    location = /daily-checkin/student/support-hub {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files /daily-checkin/index.html =404;
    }

    # The actual post-login landing page (authRedirect.js's getDefaultPostLoginPath).
    location = /daily-checkin/home {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files /daily-checkin/index.html =404;
    }

    # Never cache service worker files - browser must always fetch latest
    location ~ ^/daily-checkin/(sw\.js|mws-sw\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Asset caching (hashed filenames, immutable)
    location /daily-checkin/assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # MTSS fallback for unified deployments. The gateway normally owns /mtss,
    # but this keeps direct hits to this container from rendering a 404.
    location /mtss/ {
        set $mtss_fe mtss-system-fe;
        proxy_pass http://$mtss_fe:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /mtss {
        return 308 /mtss/;
    }

    # ── SPA routing under /daily-checkin/ ────────────────────────────────
    location /daily-checkin/ {
        try_files $uri $uri/ /daily-checkin/index.html;
    }
}
