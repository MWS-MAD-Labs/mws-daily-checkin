# mws-daily-checkin - local reference compose
# ─────────────────────────────────────────────────────────
# Local use only: it publishes the frontend on host port 8081 (set DAILY_WEB_PORT to use another one).
# Komodo stacks use deploy/staging.compose.yml and deploy/production.compose.yml, which publish no host port and
# join the gateway network instead.
# ─────────────────────────────────────────────────────────

services:
  backend:
    image: ghcr.io/mws-mad-labs/mws-daily-checkin-be:staging
    container_name: mws-daily-checkin-be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    networks:
      - daily-checkin-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/mws-mad-labs/mws-daily-checkin-fe:staging
    container_name: mws-daily-checkin-fe
    restart: unless-stopped
    ports:
      - "${DAILY_WEB_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - daily-checkin-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  daily-checkin-net:
    name: mws-daily-checkin-net
    driver: bridge
